<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" role="img" aria-label="Architecture UA Intelligence : une requête descend des appelants à travers six couches jusqu'aux systèmes sources de la marque, la réponse remonte ; configuration, consentement, secrets, journal et observabilité sont transverses ; trois seuls stockages produit.">
  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif; fill: #1f2328; }
    .t { font-size: 20px; font-weight: 700; }
    .st { font-size: 12.5px; fill: #59636e; }
    .cap { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; fill: #59636e; }
    .ln { font-size: 13px; font-weight: 700; }
    .ld { font-size: 11px; fill: #59636e; }
    .bn { font-size: 12px; font-weight: 700; }
    .bs { font-size: 10px; fill: #59636e; }
    .sm { font-size: 11px; fill: #59636e; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .band { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #afb8c1; }
    .dash { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 5 4; }
    .acc { fill: #e3f2ef; stroke: #0f766e; stroke-width: 1.5; }
    .acct { fill: #0f766e; font-size: 10px; font-weight: 700; }
    .arr { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .arrd { stroke: #57606a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .c { text-anchor: middle; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1280" height="1000" fill="#ffffff"/>

  <!-- Titre -->
  <text x="40" y="40" class="t">UA Intelligence — architecture MVP</text>
  <text x="40" y="62" class="st">Une requête traverse six couches ; les données métier sont calculées à la demande, jamais stockées comme référentiel.</text>

  <!-- Appelants -->
  <text x="140" y="92" class="cap">APPELANTS · NIVEAU D'ACCÈS</text>
  <rect x="140" y="100" width="152" height="52" rx="6" class="box"/>
  <text x="216" y="122" class="bn c">Site &amp; app</text><text x="216" y="140" class="bs c">Interne · jeton de service</text>
  <rect x="302" y="100" width="152" height="52" rx="6" class="box"/>
  <text x="378" y="122" class="bn c">Vendeur · SAV</text><text x="378" y="140" class="bs c">Interne · rôles</text>
  <rect x="464" y="100" width="152" height="52" rx="6" class="box"/>
  <text x="540" y="122" class="bn c">Chat Gen UI</text><text x="540" y="140" class="bs c">Interne</text>
  <rect x="626" y="100" width="152" height="52" rx="6" class="box"/>
  <text x="702" y="122" class="bn c">Assistants, agents tiers</text><text x="702" y="140" class="bs c">Public · clé API, quotas</text>
  <rect x="788" y="100" width="152" height="52" rx="6" class="dash"/>
  <text x="864" y="122" class="bn c" fill="#59636e">Agent d'un client</text><text x="864" y="140" class="bs c">Délégué · OAuth 2.1 — V2</text>

  <line x1="216" y1="152" x2="216" y2="180" class="arr" marker-end="url(#ah)"/>
  <line x1="378" y1="152" x2="378" y2="180" class="arr" marker-end="url(#ah)"/>
  <line x1="540" y1="152" x2="540" y2="180" class="arr" marker-end="url(#ah)"/>
  <line x1="702" y1="152" x2="702" y2="180" class="arr" marker-end="url(#ah)"/>
  <line x1="864" y1="152" x2="864" y2="180" class="arrd" marker-end="url(#ah)"/>

  <!-- Flux vertical (gouttière) -->
  <line x1="88" y1="186" x2="88" y2="724" class="arr" marker-end="url(#ah)"/>
  <text transform="translate(78 455) rotate(-90)" class="sm c">requête : tenant · appelant · consentement</text>
  <line x1="116" y1="724" x2="116" y2="186" class="arr" marker-end="url(#ah)"/>
  <text transform="translate(130 455) rotate(-90)" class="sm c">réponse : partielle si une source tombe</text>

  <!-- 6 Exposition -->
  <rect x="140" y="182" width="800" height="84" rx="8" class="band"/>
  <text x="154" y="204" class="ln">6 · Exposition</text>
  <text x="154" y="222" class="ld">même réponse en REST,</text><text x="154" y="236" class="ld">MCP et bloc Gen UI</text>
  <rect x="330" y="192" width="190" height="48" rx="6" class="box"/>
  <text x="425" y="211" class="bn c">API REST</text><text x="425" y="228" class="bs c">JSON versionnée · OpenAPI</text>
  <rect x="534" y="192" width="190" height="48" rx="6" class="box"/>
  <text x="629" y="211" class="bn c">Serveur MCP</text><text x="629" y="228" class="bs c">SDK TypeScript · public en lecture</text>
  <rect x="738" y="192" width="190" height="48" rx="6" class="box"/>
  <text x="833" y="211" class="bn c">Bloc ui · Gen UI</text><text x="833" y="228" class="bs c">validé contre le catalogue client</text>
  <text x="330" y="256" class="bs mono">outils : search_products · check_store_stock · complete_look · recommend_size · prepare_cart …</text>

  <!-- LLM -->
  <rect x="980" y="186" width="260" height="76" rx="6" class="box"/>
  <text x="994" y="206" class="bn">Adaptateur LLM</text>
  <text x="994" y="223" class="bs">Mistral · Azure OpenAI · Vertex · Bedrock</text>
  <text x="994" y="238" class="bs">choisit le composant et le remplit,</text>
  <text x="994" y="252" class="bs">ne produit aucune donnée affichée</text>
  <line x1="980" y1="216" x2="930" y2="216" class="arrd" marker-end="url(#ah)"/>
  <text x="955" y="208" class="bs c">remplit</text>

  <!-- 5 Briques & décision -->
  <rect x="140" y="282" width="800" height="84" rx="8" class="band"/>
  <text x="154" y="304" class="ln">5 · Briques &amp; décision</text>
  <text x="154" y="322" class="ld">règles du client,</text><text x="154" y="336" class="ld">réponse justifiée</text>
  <rect x="330" y="292" width="140" height="48" rx="6" class="box"/>
  <text x="400" y="311" class="bn c">Availability</text><text x="400" y="328" class="bs c">stock web + magasin</text>
  <rect x="482" y="292" width="140" height="48" rx="6" class="box"/>
  <text x="552" y="311" class="bn c">Look</text><text x="552" y="328" class="bs c">tenue complète en stock</text>
  <rect x="634" y="292" width="140" height="48" rx="6" class="dash"/>
  <text x="704" y="311" class="bn c">Fit</text><text x="704" y="328" class="bs c">via un spécialiste</text>
  <rect x="786" y="292" width="140" height="48" rx="6" class="box"/>
  <text x="856" y="311" class="bn c">Moteur de règles</text><text x="856" y="328" class="bs c">explicables, par client</text>
  <text x="330" y="356" class="sm">→ réponse : raisons · sources · version des règles appliquée</text>

  <!-- 4 Contexte -->
  <rect x="140" y="382" width="800" height="76" rx="8" class="band"/>
  <text x="154" y="404" class="ln">4 · Contexte</text>
  <text x="154" y="422" class="ld">vue client assemblée</text><text x="154" y="436" class="ld">à la demande</text>
  <rect x="330" y="392" width="110" height="38" rx="6" class="box"/>
  <text x="385" y="407" class="bn c mono" font-size="11">consent</text><text x="385" y="422" class="bs c mono">_src: cmp</text>
  <rect x="452" y="392" width="110" height="38" rx="6" class="box"/>
  <text x="507" y="407" class="bn c mono" font-size="11">profile</text><text x="507" y="422" class="bs c mono">_src: commerce</text>
  <rect x="574" y="392" width="110" height="38" rx="6" class="box"/>
  <text x="629" y="407" class="bn c mono" font-size="11">loyalty</text><text x="629" y="422" class="bs c mono">_src: loyalty</text>
  <rect x="696" y="392" width="110" height="38" rx="6" class="box"/>
  <text x="751" y="407" class="bn c mono" font-size="11">history</text><text x="751" y="422" class="bs c mono">_src: orders</text>
  <rect x="818" y="392" width="110" height="38" rx="6" class="box"/>
  <text x="873" y="407" class="bn c mono" font-size="11">store</text><text x="873" y="422" class="bs c mono">_src: commerce</text>
  <text x="330" y="448" class="sm"><tspan class="mono">_meta</tspan> : computedAt · ttl · missing[] — le front et les agents savent ce qui manque</text>

  <!-- 3 Identité -->
  <rect x="140" y="474" width="800" height="64" rx="8" class="band"/>
  <text x="154" y="496" class="ln">3 · Identité</text>
  <text x="154" y="514" class="ld">relier les IDs d'un</text><text x="154" y="528" class="ld">même client</text>
  <rect x="330" y="484" width="280" height="44" rx="6" class="acc"/>
  <text x="470" y="502" class="bn c">Table de correspondance</text><text x="470" y="518" class="bs c">IDs pseudonymisés · stockage produit</text>
  <text x="629" y="510" class="sm c">ou</text>
  <rect x="648" y="484" width="280" height="44" rx="6" class="dash"/>
  <text x="788" y="502" class="bn c">CDP du client</text><text x="788" y="518" class="bs c">s'il résout déjà l'identité</text>

  <!-- 2 Normalisation -->
  <rect x="140" y="554" width="800" height="64" rx="8" class="band"/>
  <text x="154" y="576" class="ln">2 · Normalisation</text>
  <text x="154" y="594" class="ld">chaque réponse →</text><text x="154" y="608" class="ld">modèle commun</text>
  <rect x="330" y="564" width="598" height="44" rx="6" class="box"/>
  <text x="629" y="582" class="bn c">Modèle de contexte commun</text>
  <text x="629" y="598" class="bs c">schémas typés uniques (Zod) pour l'API, le MCP, la Gen UI et les normaliseurs</text>

  <!-- 1 Connecteurs -->
  <rect x="140" y="634" width="800" height="84" rx="8" class="band"/>
  <text x="154" y="656" class="ln">1 · Connecteurs</text>
  <text x="154" y="674" class="ld">même interface,</text><text x="154" y="688" class="ld">capacités déclarées</text>
  <g class="bs mono">
    <rect x="330" y="644" width="67" height="26" rx="13" class="box"/><text x="363.5" y="661" class="c">commerce</text>
    <rect x="406" y="644" width="67" height="26" rx="13" class="box"/><text x="439.5" y="661" class="c">search</text>
    <rect x="482" y="644" width="67" height="26" rx="13" class="box"/><text x="515.5" y="661" class="c">loyalty</text>
    <rect x="558" y="644" width="67" height="26" rx="13" class="box"/><text x="591.5" y="661" class="c">orders</text>
    <rect x="634" y="644" width="67" height="26" rx="13" class="box"/><text x="667.5" y="661" class="c">inventory</text>
    <rect x="710" y="644" width="67" height="26" rx="13" class="box"/><text x="743.5" y="661" class="c">fit</text>
    <rect x="786" y="644" width="67" height="26" rx="13" class="box"/><text x="819.5" y="661" class="c">reco</text>
    <rect x="862" y="644" width="67" height="26" rx="13" class="box"/><text x="895.5" y="661" class="c">consent</text>
  </g>
  <text x="330" y="690" class="sm mono">read() · capabilities() · health() · freshness.ttl</text>
  <text x="330" y="707" class="sm">ordre des sources : MCP éditeur › API officielle › API unifiée tierce · jamais de scraping</text>

  <!-- Cache -->
  <rect x="140" y="734" width="800" height="32" rx="6" class="box"/>
  <text x="540" y="754" class="sm c"><tspan font-weight="700" fill="#1f2328">Cache Redis</tspan> — TTL par type de donnée et par client · protège les systèmes sources</text>

  <line x1="305" y1="766" x2="305" y2="804" class="arr" marker-end="url(#ah)"/>
  <line x1="607" y1="766" x2="607" y2="804" class="arr" marker-end="url(#ah)"/>
  <line x1="842" y1="766" x2="842" y2="804" class="arr" marker-end="url(#ah)"/>
  <text x="315" y="790" class="bs">lecture si TTL expiré</text>

  <!-- Systèmes sources -->
  <rect x="140" y="806" width="330" height="122" rx="8" class="band"/>
  <text x="154" y="826" class="bn">Écosystème Salesforce — pilote Célio</text>
  <text x="154" y="848" class="sm">SFCC · SCAPI, SLAS</text>
  <text x="154" y="865" class="sm">Salesforce Loyalty</text>
  <text x="154" y="882" class="sm">OMS via Mulesoft</text>
  <text x="154" y="899" class="sm">Stock magasin OCI</text>
  <text x="154" y="916" class="sm">Einstein (recommandations)</text>

  <rect x="482" y="806" width="250" height="122" rx="8" class="band"/>
  <text x="496" y="826" class="bn">Shopify — 2e pilote à confirmer</text>
  <text x="496" y="848" class="sm">Storefront &amp; Admin API</text>
  <text x="496" y="865" class="sm">Commandes</text>
  <text x="496" y="882" class="sm">Stock par emplacement</text>
  <text x="496" y="899" class="sm">Recommandations</text>

  <rect x="744" y="806" width="196" height="122" rx="8" class="band"/>
  <text x="758" y="826" class="bn">Spécialistes &amp; tiers</text>
  <text x="758" y="848" class="sm">Algolia (MCP)</text>
  <text x="758" y="865" class="sm">True Fit (MCP)</text>
  <text x="758" y="882" class="sm">CMP / CRM consentement</text>

  <!-- Transverse -->
  <rect x="980" y="282" width="260" height="646" rx="8" class="band"/>
  <text x="994" y="302" class="cap">TRANSVERSE · CLOISONNÉ PAR CLIENT</text>

  <rect x="992" y="314" width="236" height="100" rx="6" class="acc"/>
  <text x="1006" y="336" class="bn">Configuration client</text><text x="1214" y="336" class="acct" text-anchor="end">STOCKAGE</text>
  <text x="1006" y="356" class="bs">PostgreSQL · un schéma par client</text>
  <text x="1006" y="372" class="bs">connecteurs actifs, règles, TTL,</text>
  <text x="1006" y="388" class="bs">catalogue Gen UI — versionnée</text>

  <rect x="992" y="438" width="236" height="100" rx="6" class="box"/>
  <text x="1006" y="460" class="bn">Consentement</text>
  <text x="1006" y="480" class="bs">vérifié à chaque appel</text>
  <text x="1006" y="496" class="bs">source : CMP ou CRM du client</text>
  <text x="1006" y="512" class="bs">aucune donnée perso sans lui</text>

  <rect x="992" y="562" width="236" height="100" rx="6" class="box"/>
  <text x="1006" y="584" class="bn">Coffre de secrets</text>
  <text x="1006" y="604" class="bs">un espace par client</text>
  <text x="1006" y="620" class="bs">identifiants sources côté serveur,</text>
  <text x="1006" y="636" class="bs">jamais exposés au front ni aux agents</text>

  <rect x="992" y="686" width="236" height="100" rx="6" class="acc"/>
  <text x="1006" y="708" class="bn">Journal</text><text x="1214" y="708" class="acct" text-anchor="end">STOCKAGE</text>
  <text x="1006" y="728" class="bs">client · appelant · outil ·</text>
  <text x="1006" y="744" class="bs">connecteurs lus · version des règles</text>
  <text x="1006" y="760" class="bs">· consentement — RGPD, AI Act art. 50</text>

  <rect x="992" y="810" width="236" height="100" rx="6" class="box"/>
  <text x="1006" y="832" class="bn">Observabilité</text>
  <text x="1006" y="852" class="bs">OpenTelemetry de bout en bout</text>
  <text x="1006" y="868" class="bs">latence par client et par connecteur</text>
  <text x="1006" y="884" class="bs">coût par requête suivi</text>

  <!-- Légende -->
  <rect x="140" y="952" width="16" height="14" rx="3" class="acc"/>
  <text x="164" y="963" class="sm">les trois seuls stockages du produit</text>
  <rect x="390" y="952" width="16" height="14" rx="3" class="dash"/>
  <text x="414" y="963" class="sm">hors MVP ou optionnel</text>
  <text x="580" y="963" class="sm">Si le layer tombe : le site affiche son contenu standard, le chat répond sans personnalisation.</text>
</svg>
